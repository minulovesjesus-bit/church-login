[project]
name = "church-attendance-system"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "pydantic-settings==2.15.0",
  "PyJWT[crypto]==2.13.0",
  "psycopg[binary,pool]==3.3.4",
  "httpx==0.28.1",
  "email-validator==2.3.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.uv]
package = false
